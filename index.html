<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" <meta name="description"
        content="Geberador de paleta de colores para diseñadores gráficos y desarrolladores web. Crea combinaciones de colores personalizadas para tus proyectos de diseño.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./CSS/styles.css">
</head>

<body>

    <header>
        <div class="header-content">
            <h1 class="arcoiris">Colorfly Studio</h1>
            <p class="header-subtitle">Generador de Paleta de colores</p>
    </header>
    <main>

        <section class="controls-wrapper">
            <div class="control-group">
                <p id="size-label">Tamaño de la paleta</p>
                <div class="toggle-group palette-size">
                    <button class="btn active" data-size="6">6</button>
                    <button class="btn" data-size="8">8</button>
                    <button class="btn" data-size="9">9</button>
                </div>
            </div>
            <div class="control-group">
                <p>Formato de color</p>
                <div class="toggle-group format">
                    <button class="btn active" data-format="hex">HEX</button>
                    <button class="btn" data-format="hsl">HSL</button>
                </div>
            </div>
            <button id="btn-generate">Generar paleta</button>
        </section>


        </section>

    </main>

    <footer>
        <p>© 2026 Colorfly Studio. Todos los derechos reservados.</p>
    </footer>

    <script src="./JS/app.js" defer></script>
</body>

</html>
