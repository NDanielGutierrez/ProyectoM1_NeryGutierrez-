<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" <meta name="description"
        content="Geberador de paleta de colores para diseñadores gráficos y desarrolladores web. Crea combinaciones de colores personalizadas para tus proyectos de diseño.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./CSS/styles.css">
</head>

<body>

    <header>
        <div class="header-content">
            <div class="fox-container">
                <img src="./images/zorro2.jpg"
          alt=" zorro mascota de Colorfly Studio" class="zorro-img" id="zorro-img">
            </div>
            <h1 class="arcoiris">Colorfly Studio</h1>
            <p class="header-subtitle">Generador de Paleta de colores</p>
    </header>
    <main>

        <section class="controls-wrapper" aria-label="Opciones de paleta">
            <div class="control-group">
                <p id="size-label">Tamaño de la paleta</p>
                <div class="toggle-group palette-size">
                    <button class="btn active" data-size="6" aria-pressed="true">6</button>
                    <button class="btn" data-size="8" aria-pressed="false">8</button>
                    <button class="btn" data-size="9" aria-pressed="false">9</button>
                </div>
            </div>
            <div class="control-group">
                <p class="control-label" id="format-label">Formato de color</p>
                <div class="toggle-group format" role="group" aria-labelledby="format-label">
                    <button class="btn active" data-format="hex" aria-pressed="true">HEX</button>
                    <button class="btn" data-format="hsl" aria-pressed="false">HSL</button>
                </div>
                <button id="btn-generate" aria-label="Generar nueva paleta de colores">Generar paleta</button>

                <section class="palette" id="palette" aria-label="Paleta de colores generada"></section>

                <section class="action-bar" aria-label="Acciones de la paleta">
                    <button id="btn-save" aria-label="Guardar paleta actual">💾 Guardar paleta</button>
                    <button id="btn-export" aria-label="Exportar paleta como PNG">📥 Exportar PNG</button>
                    <button id="btn-clear" aria-label="Limpiar historial de paletas guardadas">🗑 Limpiar
                        historial</button>
                </section>
                <section class="history-section" id="history-section" aria-label="Historial de paletas guardadas">
                    <h2 class="history-title">Paletas guardadas</h2>
                    <div class="history-list" id="history-list">


    </main>

    <footer>
        <p>© 2026 Colorfly Studio. Todos los derechos reservados.</p>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <canvas id="export-canvas" style="display:none"></canvas>

    <script src="./JS/app.js" defer></script>
</body>

</html>
