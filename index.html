<!DOCTYPE html>

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" 
        <title> Colorfly Studio - Generador de Paleta de colores </title>
        <meta name="description" content="Geberador de paleta de colores para diseñadores gráficos y desarrolladores web. Crea combinaciones de colores personalizadas para tus proyectos de diseño.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./CSS/styles.css">
    </head>
    <body>

        <header>
            <h1>Colorfly Studio</h1>
            <p>Generador de Paleta de colores</p>
        </header>
        <main>
        
        <section class="controls">
        <label for="palette-size">Tamaño de la paleta:</label>
        <select id="palette-size">
            <option value="6">6 colores</option>
            <option value="8">8 colores</option>
            <option value="9">9 colores</option>
        </select>

        <button id="btn-generate">Generar paleta</button>
        </section>
        <section class="palette" id="palette-container">
            
        </section>

        </main>

        <footer>
            <p>© 2026 Colorfly Studio. Todos los derechos reservados.</p>
        </footer>

        <script src="./JS/app.js"  defer></script>
    </body>
</html>
